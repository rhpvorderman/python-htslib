[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "htslib"
dynamic = ["version"]
description = """
Htslib bindings for python focusing on Python C-extension developers
"""
license="GPL-3.0-or-later"
keywords=["htslib"]
authors = [{name = "Leiden University Medical Center"},
           {email = "r.h.p.vorderman@lumc.nl"}]
readme = "README.rst"
requires-python = ">=3.11"
classifiers = [
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Programming Language :: Python :: Implementation :: CPython",
        "Programming Language :: C",
        "Development Status :: 3 - Alpha",
        "Topic :: Scientific/Engineering :: Bio-Informatics",
        "Operating System :: POSIX :: Linux",
]
urls.homepage = "https://github.com/rhpvorderman/python-htslib"

[tool.setuptools_scm]
version_file = "src/htslib/_version.py"

[tool.setuptools.packages.find]
where = ["src"]
include = ["htslib"]

[tool.setuptools.package-data]
htslib = ['*.pyi', 'py.typed']
[tool.setuptools.exclude-package-data]
htslib = [
        "*.c",
        "*.h",
]
